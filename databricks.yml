bundle:
  name: databricks_Learning

include:
  - resources/*.yml

sync:
  paths:
    - ./src/notebooks

variables:
  source_volume_path:
    description: "Source Unity Catalog Volume path where files land"
    default: /Volumes/databricks_learning_catalog/landing/source

  target_volume_path:
    description: "Target Unity Catalog Volume path where files get copied"
    default: /Volumes/databricks_learning_catalog/landing/target

  raw_catalog_name:
    description: "Unity Catalog name for the raw database"
    default: databricks_learning_catalog

  raw_schema_name:
    description: "Unity Catalog schema name for the raw database"  
    default: raw

  raw_table_name:
    description: "Unity Catalog table name for the raw database"
    default: raw_employee_data

permissions:
  - level: CAN_MANAGE
    group_name: users

targets:
  # 1. VS Code Developer Mode (personal isolated sandbox)
  # Deploys under /Workspace/Users/<your-email>/.bundle/databricks_Learning/vscodedev
  # Prefixes job names with [dev <your_user_prefix>]
  vscodedev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405614984857704.4.azuredatabricks.net
      profile: vscodedev

  # 2. Shared DEV Mode (team shared deployment)
  # Deploys under /Workspace/Shared/databricks_Learning
  # Deploys standard non-prefixed job names
  dev:
    mode: production
    workspace:
      host: https://adb-7405614984857704.4.azuredatabricks.net
      root_path: /Workspace/Shared/${bundle.name}
      profile: vscodedev